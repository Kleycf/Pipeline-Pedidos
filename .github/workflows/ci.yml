name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest

  entrega:
    needs: testes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./pipeline
          push: true
          tags: |
            ghcr.io/kleycf/pipeline-pedidos:latest
            ghcr.io/kleycf/pipeline-pedidos:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./API
          push: true
          tags: |
            ghcr.io/kleycf/api-pedidos:latest
            ghcr.io/kleycf/api-pedidos:${{ github.sha }}